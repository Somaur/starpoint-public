name: Source checks
on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Rust 1.78
        run: rustup toolchain install 1.78.0 --profile minimal
      - name: Build TypeScript and styles
        run: npm ci && npm run build
      - name: Check repaired data contracts
        shell: bash
        run: |
          set -euo pipefail
          for name in cn-battle-contract cn-gacha-features cn-local-gacha-tickets cn-tutorial-gacha cn-gacha-region-policy; do
            node "scripts/protocol-lab/test-$name.mjs"
          done
      - name: Test release volumes and client patch
        run: python -m unittest discover -s scripts/distribution -p 'test_*.py' -v
      - name: Test personal service
        run: cargo +1.78.0 test --locked --jobs 2 --manifest-path core/personal-service/Cargo.toml -- --test-threads=1
