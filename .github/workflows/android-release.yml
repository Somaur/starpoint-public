name: Android distribution
on:
  push:
    tags: ['somaur-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    if: github.repository == 'Somaur/starpoint-public' && startsWith(github.ref, 'refs/tags/somaur-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Make room for the 12 GB CDN and release volumes
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Install pinned build tools
        run: |
          rustup toolchain install 1.78.0 --profile minimal --target aarch64-linux-android
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018' 'build-tools;35.0.0'
      - name: Compile repaired native service
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo +1.78.0 build --locked --release --lib --target aarch64-linux-android --manifest-path core/personal-service/Cargo.toml
          mkdir -p build/native
          "$CC_aarch64_linux_android" -fPIC -shared -Wall -Wextra -Werror \
            -Wl,--build-id=sha1 -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -Wl,-z,noexecstack -Wl,-z,relro -Wl,-z,now \
            -I core/personal-service/include platforms/android/CompanionHost/native/starpoint_android_bridge.c \
            "$CARGO_TARGET_DIR/aarch64-linux-android/release/libstarpoint_personal_service.a" \
            -landroid -latomic -ldl -llog -lm -lunwind -o build/native/libstarpoint_android_bridge.so
          "$toolchain/llvm-strip" --strip-unneeded build/native/libstarpoint_android_bridge.so
      - name: Sign and package the verified baseline with local repairs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/starpoint.keystore"
          trap 'rm -f "$RUNNER_TEMP/starpoint.keystore"' EXIT
          python scripts/distribution/package_android.py \
            --work build/package --output build/release --version "$VERSION" \
            --library build/native/libstarpoint_android_bridge.so \
            --build-tools "$ANDROID_SDK_ROOT/build-tools/35.0.0" \
            --keystore "$RUNNER_TEMP/starpoint.keystore"
      - name: Upload a draft release for device verification
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" --verify-tag --draft --prerelease \
            --title "Starpoint Somaur $VERSION" --notes-file deployment/distribution/RELEASE_NOTES.md
          gh release upload "$VERSION" build/release/*
          echo "Draft uploaded; verify installation before publishing." >> "$GITHUB_STEP_SUMMARY"
